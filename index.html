<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>08-00</title>
        <style>
            body {
                background-color: black;
                color: white;
            }

            .header-container {
                text-align: center;
            }

            /* Styles for the landscape GIF */
            .header-gif {
                width: 100%;          /* Stretches to fill the container width */
                max-width: 800px;     /* Limits max width so it doesn't get unnaturally huge */
                height: auto;         /* Maintains landscape aspect ratio */
                display: block;
                margin: 0 auto;       /* Centers the GIF horizontally */
                border-radius: 8px;   /* Optional: adds slightly rounded corners */
            }

            .underlined-heading {
                text-decoration: underline;
            }

            .content-container {
                text-align: center;
            }

            .content-container ol {
                display: inline-block;
                text-align: left;
            }

            h1 {
                margin-top: 15px;
                margin-bottom: 0px;
            }

            a {
                color: #4ea8de;
            }
        </style>
    </head>

    <body>
        <div class="header-container">
            <img class="header-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z0dzQ3eGZ2eXp5eGZ2eXp5eGZ2eXp5eGZ2eXp5eGZ2eXp5/3o7rc0qU6b52Nk/giphy.gif" alt="Landscape GIF">
            
            <h1 class="underlined-heading">Welcome</h1>
        </div>

        <div class="content-container">
            <ol>
                <li><a href="https://www.nasa.gov/" target="_blank">www.nasa.gov</a></li>
            </ol>
        </div>
    </body>
</html>
