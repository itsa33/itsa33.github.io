<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>20:00</title>
        
        <link rel="icon" type="image/png" href="PIA12000~orig.png?v=2">
        
        <style>
            :root {
                --background: #080808;
                --surface-line: #303030;
                --text: #eeeeee;
                --muted: #999999;
                --accent: #ffffff;
                --link: #c9c9c9;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                background-color: var(--background);
                background-image:
                    radial-gradient(circle at 16% 22%, rgba(255, 255, 255, 0.72) 0 1px, transparent 1.5px),
                    radial-gradient(circle at 82% 15%, rgba(255, 255, 255, 0.58) 0 1px, transparent 1.5px),
                    radial-gradient(circle at 72% 62%, rgba(255, 255, 255, 0.5) 0 1px, transparent 1.5px),
                    radial-gradient(circle at 22% 78%, rgba(255, 255, 255, 0.42) 0 1px, transparent 1.5px);
                background-size: 310px 260px, 430px 350px, 370px 420px, 520px 440px;
                color: var(--text);
                font-family: Georgia, serif;
                font-size: 17px;
                line-height: 1.5;
            }

            .header-container {
                max-width: 760px;
                margin: 0 auto;
                padding: 64px 24px 0;
                text-align: center;
            }

            .header-gif {
                width: min(350px, 100%);
                height: auto;
                display: block;
                margin: 0 auto;
                border: 1px solid var(--surface-line);
                box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
                filter: none;
            }

            .underlined-heading {
                margin: 26px 0 0;
                color: var(--text);
                font-family: Georgia, serif;
                font-size: clamp(2.4rem, 7vw, 4.2rem);
                font-weight: normal;
                letter-spacing: 0.035em;
            }

            .underlined-heading::after {
                content: "";
                display: block;
                width: 56px;
                height: 2px;
                margin: 18px auto 0;
                background: var(--accent);
            }

            .content-container {
                max-width: 760px;
                margin: 64px auto 0;
                padding: 0 24px 56px;
            }

            .link-groups {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 22px 48px;
            }

            .link-group {
                position: relative;
                border-top: 1px solid var(--surface-line);
                padding-top: 16px;
            }

            .link-group::after {
                content: "";
                position: absolute;
                top: -1px;
                right: 0;
                width: 34px;
                border-top: 1px solid var(--accent);
            }

            .link-group h2 {
                margin: 0 0 11px;
                color: var(--muted);
                font-family: "Helvetica Neue", Arial, sans-serif;
                font-size: 0.7rem;
                font-weight: normal;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            .link-group h2::before {
                content: "01 / ";
                color: var(--accent);
            }

            .link-group:nth-child(2) h2::before {
                content: "02 / ";
            }

            .link-group:nth-child(3) h2::before {
                content: "03 / ";
            }

            .link-group:nth-child(4) h2::before {
                content: "04 / ";
            }

            .link-group ul {
                margin: 0;
                padding: 0;
                list-style: none;
            }

            .link-group li {
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            a {
                display: block;
                padding: 7px 0;
                color: var(--link);
                text-decoration-color: transparent;
                text-underline-offset: 4px;
                transition: color 160ms ease, text-decoration-color 160ms ease;
            }

            a:hover,
            a:focus-visible {
                color: var(--text);
                text-decoration-color: var(--accent);
            }

            a:focus-visible {
                outline: 1px solid var(--accent);
                outline-offset: 4px;
            }

            @media (max-width: 600px) {
                .header-container {
                    padding-top: 28px;
                }

                .content-container {
                    margin-top: 48px;
                    padding: 0 18px 40px;
                }

                .link-groups {
                    grid-template-columns: 1fr;
                    gap: 18px;
                }
            }
        </style>
    </head>

    <body>
        <div class="header-container">
            <img class="header-gif" src="nasa_rocket_liftoff.gif" alt="Landscape GIF">
            
            <h1 class="underlined-heading">Welcome</h1>
        </div>

        <div class="content-container">
            <div class="link-groups">
                <section class="link-group">
                    <h2>Reminders</h2>
                    <ul>
                        <li><a href="https://quran.com/" target="_blank" rel="noopener noreferrer">quran.com</a></li>
                        <li><a href="https://quran.com/28/24" target="_blank" rel="noopener noreferrer">quran.com/28/24</a></li>
                        <li><a href="https://99namesofallah.name/" target="_blank" rel="noopener noreferrer">The 99 Names of Allah</a></li>
                        <li><a href="https://youtube.com/shorts/pft_KF4TCks?si=7iWHMD9A5gbpPjxw" target="_blank" rel="noopener noreferrer">1883 (1)</a></li>
                    </ul>
                </section>

                <section class="link-group">
                    <h2>Science</h2>
                    <ul>
                        <li><a href="https://www.nasa.gov/" target="_blank" rel="noopener noreferrer">www.nasa.gov</a></li>
                        <li><a href="https://www.mit.edu/" target="_blank" rel="noopener noreferrer">www.mit.edu</a></li>
                        <li><a href="https://www.khanacademy.org/" target="_blank" rel="noopener noreferrer">www.khanacademy.org</a></li>
                    </ul>
                </section>

                <section class="link-group">
                    <h2>Writing</h2>
                    <ul>
                        <li><a href="https://typst.app/docs/" target="_blank" rel="noopener noreferrer">typst.app/docs</a></li>
                    </ul>
                </section>

                <section class="link-group">
                    <h2>Social Media</h2>
                    <ul>
                        <li><a href="https://discord.com/" target="_blank" rel="noopener noreferrer">discord.com</a></li>
                    </ul>
                </section>
            </div>
        </div>
    </body>
</html>
